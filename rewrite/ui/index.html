<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCoder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">CLEAN RUNTIME · CONTRACT V1</p>
      <h1>AutoCoder</h1>
      <form id="task-form">
        <label for="intent">Create the first task</label>
        <textarea id="intent" required autofocus></textarea>
        <button type="submit">Create task</button>
      </form>
      <output id="result" aria-live="polite">Runtime ready</output>
      <section id="projection" hidden>
        <h2>Durable task projection</h2>
        <dl>
          <dt>Task</dt><dd id="projection-task"></dd>
          <dt>State</dt><dd id="projection-state"></dd>
          <dt>Revision</dt><dd id="projection-revision"></dd>
        </dl>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
