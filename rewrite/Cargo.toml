[workspace]
members = ["contracts", "ledger", "orchestration", "persistence", "application", "desktop"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
