name: Clean rewrite CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: rewrite
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Rust workspace tests
        run: cargo +1.88.0 test --workspace --locked

      - name: Rust formatting
        run: cargo +1.88.0 fmt --all -- --check

      - name: Rust lint
        run: cargo +1.88.0 clippy --workspace --all-targets --locked -- -D warnings

  ui:
    name: Node UI tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: rewrite
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run UI tests
        run: node --test ui/main.test.mjs
